name: Build WechatDuo

on:
  push:
    branches: [ main, master, wechatduo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot zip ldid 2>&1 | tee /tmp/logs/apt.log || true

      - name: Install Theos, toolchain & SDK
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            export THEOS=$HOME/theos
            for i in 1 2 3; do
              if [ -d $THEOS/.git ]; then break; fi
              rm -rf $THEOS && git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS && break || { echo "theos clone attempt $i failed"; rm -rf $THEOS; sleep 5; }
            done
            [ -d $THEOS/.git ] || { echo "::error::theos clone failed after retries"; exit 1; }
            sudo apt-get install -y libtinfo6 xz-utils || true
            if [ ! -x $THEOS/toolchain/linux/iphone/bin/clang ]; then
              mkdir -p $THEOS/toolchain
              for i in 1 2 3; do
                curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz -o /tmp/tc.tar.xz && break
                echo "toolchain dl attempt $i failed"; sleep 5
              done
              tar -xJf /tmp/tc.tar.xz -C $THEOS/toolchain/
            fi
            [ -x $THEOS/toolchain/linux/iphone/bin/clang ] || { echo "::error::toolchain clang missing"; exit 1; }
            if ! ls $THEOS/sdks/ 2>/dev/null | grep -q sdk; then
              for i in 1 2 3; do
                $THEOS/bin/install-sdk latest && break || { echo "install-sdk attempt $i failed"; sleep 8; }
              done
            fi
            if ! ls $THEOS/sdks/ 2>/dev/null | grep -q sdk; then
              rm -rf $THEOS/sdks
              git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks || true
            fi
            ls $THEOS/sdks/ 2>/dev/null | grep -q sdk || { echo "::error::no SDK available"; exit 1; }
            $THEOS/toolchain/linux/iphone/bin/clang --version | head -2
            echo "THEOS=$THEOS" >> $GITHUB_ENV
          } 2>&1 | tee /tmp/logs/theos.log

      - name: Ensure ldid
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            for i in 1 2 3; do
              curl -fL --retry 3 -o /tmp/ldid_bin https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 && break
              echo "curl attempt $i failed"; sleep 5
            done
            [ -f /tmp/ldid_bin ] || { echo "::error::ldid download failed"; exit 1; }
            sudo install -m 755 /tmp/ldid_bin /usr/local/bin/ldid
            hash -r
            which ldid
            ldid -V || true
          } 2>&1 | tee /tmp/logs/ldid.log

      - name: Build (rootless)
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            cd $GITHUB_WORKSPACE
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
            ls -la packages/ || true
            ls -la .theos/obj/ || true
          } 2>&1 | tee /tmp/logs/build.log

      - name: Collect artifacts
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            mkdir -p dist
            python3 tools/macho_info.py .theos/obj/WechatDuo.dylib || true
            python3 tools/adhoc_sign.py .theos/obj/WechatDuo.dylib WechatDuo
            python3 tools/verify_sig.py .theos/obj/WechatDuo.dylib
            python3 tools/macho_info.py .theos/obj/WechatDuo.dylib
            cp .theos/obj/WechatDuo.dylib dist/WechatDuo.dylib
            python3 tools/verify_sig.py dist/WechatDuo.dylib
            ( cd dist && zip -q -r WechatDuo-trollfools-dylib.zip WechatDuo.dylib )
            ls -la dist/
          } 2>&1 | tee /tmp/logs/collect.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WechatDuo-build
          path: dist/*

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.18
          name: WechatDuo v1.1.18
          body: |
            微信 8.0.70+ 全页面卡片化（TrollFools 注入）

            - **v1.1.18**
              - 搜索栏：胶囊改为「高度 ≤48 且画了底」的那层输入条，不再把 60~70pt 高的
                白底外壳当成胶囊（之前整条搜索栏变成巨型白色胶囊就是这个原因）
              - 胶囊外沿途画底的白条容器一并清透明（关掉总开关可还原）
              - 通讯录表头恢复清理，但跳过搜索栏子树 —— 表头不再整条白
            - **v1.1.17**
              - 搜索栏：不再按类名猜，改为按「是否真的含输入框」判定；缩进改为收窄整条搜索栏，
                不再去挪胶囊，自动布局也不会把它打回原形
              - 搜索栏不再被页面底色覆盖（`WDPaintTree` 曾把 SearchBar 整块刷成页面色）
              - 通讯录点一下卡片就错位：布局后自动把内缩贴回去，不再被系统复位
              - 「新的朋友」/「我」页进出闪烁：样式改在可见前完成，且全程关掉隐式动画
              - 清理死代码（WDTabTitle / WDCatalogIndexesForGroup / WDNudgeKey / 空 reload 等），
                补全 gSnap 索引上界判断，移除无效的 WCSearchViewController 钩子
            - **v1.1.16**
              - 通讯录五大类与好友行不再错位：内部元素超出卡片时「收窄」而非「平移」
              - 「新的朋友」、「我」页资料卡：改动挪到 viewWillAppear，进页面不再闪一下
            - **v1.1.15**
              - 搜索栏：识别放宽 + 表头/可见面板兜底，首页与通讯录搜索栏真正套上圆角与缩进
              - 「我」页资料卡与顶栏剥离，顶部留缝，四个圆角完整露出
              - 通讯录五个大类的行内容同样缩进，不再顶出卡片
              - 修复「新的朋友」底部留白变黑：改为刷页面底色，不再全透明
            - **v1.1.14**
              - 搜索栏：圆角与缩进跟随卡片全局值；只保留一层外观，不再出现双层搜索栏
              - 首页卡片内容真正缩进（容器宽度内缩 + 溢出兜底），不再顶到卡片边缘
              - 「新的朋友」等页面底部留白整块透明
              - 修复公众号 / 服务号列表头像被误清空
              - 隐藏所有卡片行的引导箭头（返回键保留）
            - **v1.1.13**
              - 置顶横幅全透明，不再留白角，仍可点击
              - 会话行头像/时间离卡片边更远
              - 「我」页资料卡顶角圆、双侧缩进
              - 通讯录搜索只圆内层胶囊，去掉第二层
              - 「新的朋友」区头透明、列表底圆角
              - 搜索 / 钱包 / 服务 / 区头开关按各自配置生效，不再劫持首页 inset

          files: |
            dist/WechatDuo.dylib
            dist/WechatDuo-trollfools-dylib.zip
          fail_on_unmatched_files: false

      - name: Upload failure logs to Release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          tag="ci-logs-${{ github.run_id }}"
          gh release create "$tag" --title "$tag" --notes "CI failure logs (auto)" 2>/dev/null || true
          gh release upload "$tag" /tmp/logs/* --clobber || echo "log upload failed"
