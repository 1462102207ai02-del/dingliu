name: Build dingliu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot zip ldid 2>&1 | tee /tmp/logs/apt.log || true
          which ldid || echo "no apt ldid"

      - name: Install Theos, toolchain & SDK
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            export THEOS=$HOME/theos
            for i in 1 2 3; do
              if [ -d $THEOS/.git ]; then break; fi
              rm -rf $THEOS && git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS && break || { echo "theos clone attempt $i failed"; rm -rf $THEOS; sleep 5; }
            done
            [ -d $THEOS/.git ] || { echo "::error::theos clone failed after retries"; exit 1; }
            sudo apt-get install -y libtinfo6 xz-utils || true
            # iOS cross toolchain (official install-theos method, non-swift)
            if [ ! -x $THEOS/toolchain/linux/iphone/bin/clang ]; then
              mkdir -p $THEOS/toolchain
              for i in 1 2 3; do
                curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz -o /tmp/tc.tar.xz && break
                echo "toolchain dl attempt $i failed"; sleep 5
              done
              ls -la /tmp/tc.tar.xz
              tar -xJf /tmp/tc.tar.xz -C $THEOS/toolchain/
            fi
            [ -x $THEOS/toolchain/linux/iphone/bin/clang ] || { echo "::error::toolchain clang missing"; exit 1; }
            # patched SDK (official install-sdk, with retry + clone fallback)
            if ! ls $THEOS/sdks/ 2>/dev/null | grep -q sdk; then
              for i in 1 2 3; do
                $THEOS/bin/install-sdk latest && break || { echo "install-sdk attempt $i failed"; sleep 8; }
              done
            fi
            if ! ls $THEOS/sdks/ 2>/dev/null | grep -q sdk; then
              rm -rf $THEOS/sdks
              git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks || true
            fi
            ls $THEOS/sdks/ 2>/dev/null | grep -q sdk || { echo "::error::no SDK available"; exit 1; }
            ls $THEOS/sdks/ | head
            $THEOS/toolchain/linux/iphone/bin/clang --version | head -2
            echo "THEOS=$THEOS" >> $GITHUB_ENV
          } 2>&1 | tee /tmp/logs/theos.log

      - name: Ensure ldid
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            # 无条件用 ProcursusTeam 最新预编译 ldid 覆盖（apt 的旧版 ldid
            # 对含 chained fixups 的 Mach-O 重签会写出乱码签名偏移）
            for i in 1 2 3; do
              curl -fL --retry 3 -o /tmp/ldid_bin https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 && break
              echo "curl attempt $i failed"; sleep 5
            done
            [ -f /tmp/ldid_bin ] || { echo "::error::ldid download failed"; exit 1; }
            sudo install -m 755 /tmp/ldid_bin /usr/local/bin/ldid
            hash -r
            which ldid
            ldid -V || true
          } 2>&1 | tee /tmp/logs/ldid.log

      - name: Build (rootless)
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            cd $GITHUB_WORKSPACE
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
            ls -la packages/ || true
            ls -la .theos/obj/ || true
          } 2>&1 | tee /tmp/logs/build.log

      - name: Collect artifacts
        run: |
          set -o pipefail
          mkdir -p /tmp/logs
          {
            set -e
            mkdir -p dist
            # 关键修复：Theos 在 Linux 产出的伪签名 LC_CODE_SIGNATURE 是坏的
            #（偏移/大小为乱码），dyld 强加载校验签名失败 → 秒闪退无日志。
            # 必须去签 + 重签 + 程序化校验。
            # 关键修复：Theos/ldid 对此类文件产出的伪签名 LC_CODE_SIGNATURE 是坏的
            #（偏移/大小为乱码，ldid 重签只追加 blob 不写 LC），dyld 强加载校验
            # 签名失败 → 秒闪退无日志。改用自研 adhoc 签名器全程可控。
            python3 tools/adhoc_sign.py dingliu .theos/obj/dingliu.dylib
            python3 tools/verify_sig.py .theos/obj/dingliu.dylib
            # 用重签后的 dylib 重建 deb（包内 dylib 同样有效，并重算 md5sums）
            rm -rf /tmp/debx && mkdir -p /tmp/debx
            dpkg-deb -R packages/*.deb /tmp/debx
            DEBDY=$(find /tmp/debx -name dingliu.dylib -type f | head -1)
            if [ -n "$DEBDY" ]; then
              cp .theos/obj/dingliu.dylib "$DEBDY"
              ( cd /tmp/debx && find . -type f ! -path "./DEBIAN/*" -exec md5sum {} \; \
                | sed 's|  \./|  |' > DEBIAN/md5sums )
              rm -f packages/*.deb
              dpkg-deb -Zxz -b /tmp/debx packages/com.dingliu.wechat.deb
            fi
            cp packages/com.dingliu.wechat.deb dist/com.dingliu.wechat_1.0.3_iphoneos-arm64.deb
            cp .theos/obj/dingliu.dylib dist/dingliu.dylib
            python3 tools/verify_sig.py dist/dingliu.dylib
            ( cd dist && zip -q -r dingliu-trollfools-dylib.zip dingliu.dylib )
            ls -la dist/
          } 2>&1 | tee /tmp/logs/collect.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dingliu-build
          path: dist/*

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: dingliu v1.0.3 (你啊爸支鼎溜)
          body: |
            微信 8.0.70+ 圆角美化插件
            - v1.0.3 (关键修复): Theos Linux 伪签名损坏导致 dyld 校验失败秒闪退 → CI 强制 ldid 重签 + 签名完整性校验；最低系统降到 iOS 14.0；新增启动日志（微信沙盒 Documents/dingliu.log）与崩溃兜底
            - v1.0.2: 修复 hook 父子类自我递归栈溢出
            - v1.0.1: 接入「插件收纳」入口（MinimizeViewController -> WCPluginsMgr），过滤 4 个微信 bundle id
            - `com.dingliu.wechat_1.0.3_iphoneos-arm64.deb` — rootless 越狱（Dopamine/palera1n rootless）安装包
            - `dingliu.dylib` / `dingliu-trollfools-dylib.zip` — TrollFools 注入用
          files: |
            dist/*.deb
            dist/*.zip
            dist/dingliu.dylib
          fail_on_unmatched_files: false

      - name: Upload failure logs to Release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          tag="ci-logs-${{ github.run_id }}"
          gh release create "$tag" --title "$tag" --notes "CI failure logs (auto)" 2>/dev/null || true
          gh release upload "$tag" /tmp/logs/* --clobber || echo "log upload failed"
          gh release view "$tag" --json assets 2>/dev/null || true
