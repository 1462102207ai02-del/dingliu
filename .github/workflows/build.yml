name: Build dingliu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot zip

      - name: Install Theos & SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          clone_theos() {
            git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          }
          clone_sdks() {
            git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          }
          for i in 1 2 3; do
            if [ -d $THEOS/.git ]; then break; fi
            rm -rf $THEOS && clone_theos && break || { echo "theos clone attempt $i failed, retrying"; rm -rf $THEOS; sleep 5; }
          done
          [ -d $THEOS/.git ] || { echo "::error::theos clone failed after retries"; exit 1; }
          for i in 1 2 3; do
            if [ -d $THEOS/sdks/.git ]; then break; fi
            rm -rf $THEOS/sdks && clone_sdks && break || { echo "sdks clone attempt $i failed, retrying"; rm -rf $THEOS/sdks; sleep 5; }
          done
          [ -d $THEOS/sdks/.git ] || { echo "::error::sdks clone failed after retries"; exit 1; }
          git -C $THEOS submodule update --init --recursive || true
          ls $THEOS/sdks/ | head
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          for i in 1 2 3; do
            curl -sL --retry 3 -o /tmp/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 && break || sleep 5
          done
          ls -la /tmp/ldid
          file /tmp/ldid || true
          sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          ldid -V

      - name: Build (rootless)
        run: |
          cd $GITHUB_WORKSPACE
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/ || true
          ls -la .theos/obj/ || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp packages/*.deb dist/ 2>/dev/null || true
          cp .theos/obj/dingliu.dylib dist/dingliu.dylib 2>/dev/null || \
            cp .theos/obj/debug/dingliu.dylib dist/dingliu.dylib 2>/dev/null || true
          cd dist && zip -r dingliu-trollfools-dylib.zip dingliu.dylib && cd ..
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dingliu-build
          path: dist/*

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: dingliu v1.0.1 (你啊爸支鼎溜)
          body: |
            微信 8.0.70+ 圆角美化插件
            - v1.0.1: 接入「插件收纳」入口（MinimizeViewController -> WCPluginsMgr），过滤 4 个微信 bundle id
            - `com.dingliu.wechat_1.0.1_iphoneos-arm64.deb` — rootless 越狱（Dopamine/palera1n rootless）安装包
            - `dingliu.dylib` / `dingliu-trollfools-dylib.zip` — TrollFools 注入用
          files: |
            dist/*.deb
            dist/*.zip
            dist/dingliu.dylib
          fail_on_unmatched_files: false
